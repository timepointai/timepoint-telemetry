[package]
name = "tt-core"
version = "2.1.0"
edition = "2024"
license-file = "LICENSE"
description = "Timepoint Telemetry — the TT ontology, envelope and distance metric: a shared, versioned vocabulary for recording what happened, maintained on a published update cycle."
repository = "https://github.com/timepointai/timepoint-telemetry"
readme = "README.md"
keywords = ["ontology", "taxonomy", "provenance", "events", "classification"]
categories = ["data-structures", "science"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
