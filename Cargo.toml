[package]
name = "snag-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Timepoint Telemetry — the SNAG ontology, envelope and distance metric: a shared, frozen-identity vocabulary for recording what happened."
repository = "https://github.com/timepointai/timepoint-telemetry"
readme = "README.md"
keywords = ["ontology", "taxonomy", "provenance", "events", "classification"]
categories = ["data-structures", "science"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
